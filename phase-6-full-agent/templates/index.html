<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 30px;
            font-size: 24px;
            color: #a78bfa;
        }

        p.subtitle {
            color: #888;
            font-size: 14px;
            margin-top: 6px;
        }

        #chat-box {
            width: 100%;
            max-width: 700px;
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 80%;
            font-size: 15px;
            line-height: 1.5;
        }

        .user-bubble {
            background: #4f46e5;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-bubble {
            background: #1e1e1e;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #333;
        }

        .emotion-tag {
            font-size: 11px;
            color: #a78bfa;
            margin-top: 4px;
        }

        #bottom {
            width: 100%;
            max-width: 700px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        #mic-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            background: #4f46e5;
            cursor: pointer;
            font-size: 28px;
            transition: all 0.2s;
        }

        #mic-btn:hover {
            background: #6366f1;
            transform: scale(1.05);
        }

        #mic-btn.recording {
            background: #ef4444;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        #status {
            color: #888;
            font-size: 13px;
        }

        #text-input-row {
            display: flex;
            width: 100%;
            gap: 10px;
        }

        #text-input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #1e1e1e;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        #send-btn {
            padding: 10px 20px;
            border-radius: 12px;
            border: none;
            background: #4f46e5;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }

        #send-btn:hover {
            background: #6366f1;
        }
    </style>
</head>
<body>

    <h1>🎙️ Voice AI Agent</h1>
    <p class="subtitle">Speak or type — I remember you.</p>

    <div id="chat-box"></div>

    <div id="bottom">
        <button id="mic-btn">🎤</button>
        <div id="status">Press mic to speak</div>

        <div id="text-input-row">
            <input type="text" id="text-input" placeholder="Or type your message..." />
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const micBtn = document.getElementById("mic-btn");
        const status = document.getElementById("status");
        const chatBox = document.getElementById("chat-box");
        const textInput = document.getElementById("text-input");
        const sendBtn = document.getElementById("send-btn");

        let mediaRecorder;
        let audioChunks = [];

        // ─── Add bubble to chat ──────────────────────────
        function addBubble(text, type, emotion = null) {
            const bubble = document.createElement("div");
            bubble.classList.add("bubble", type === "user" ? "user-bubble" : "ai-bubble");
            bubble.innerText = text;

            if (emotion) {
                const tag = document.createElement("div");
                tag.classList.add("emotion-tag");
                tag.innerText = `Emotion: ${emotion}`;
                bubble.appendChild(tag);
            }

            chatBox.appendChild(bubble);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // ─── Send message to backend ─────────────────────
        async function sendMessage(message) {
            addBubble(message, "user");
            status.innerText = "Thinking...";

            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message })
            });

            const data = await response.json();

            if (data.error) {
                status.innerText = "Error: " + data.error;
                return;
            }

            addBubble(data.reply, "ai", data.emotion);

            // Audio play karo
            if (data.audio) {
                const audioBlob = new Blob(
                    [Uint8Array.from(atob(data.audio), c => c.charCodeAt(0))],
                    { type: "audio/wav" }
                );
                const audioUrl = URL.createObjectURL(audioBlob);
                const audio = new Audio(audioUrl);
                audio.play();
            }

            status.innerText = "Press mic to speak";
        }

        // ─── Mic button ──────────────────────────────────
        micBtn.addEventListener("click", async () => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                return;
            }

            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

            mediaRecorder.onstop = async () => {
                micBtn.classList.remove("recording");
                status.innerText = "Transcribing...";

                const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
                const formData = new FormData();
                formData.append("audio", audioBlob, "audio.webm");

                const response = await fetch("/transcribe", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();
                if (data.text) {
                    await sendMessage(data.text);
                }
            };

            mediaRecorder.start();
            micBtn.classList.add("recording");
            status.innerText = "Recording... Click again to stop";
        });

        // ─── Text input ──────────────────────────────────
        sendBtn.addEventListener("click", () => {
            const msg = textInput.value.trim();
            if (msg) {
                textInput.value = "";
                sendMessage(msg);
            }
        });

        textInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                const msg = textInput.value.trim();
                if (msg) {
                    textInput.value = "";
                    sendMessage(msg);
                }
            }
        });
    </script>

</body>
</html>
